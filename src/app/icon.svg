<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep indigo to absolute dark -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#03000A" />
    </radialGradient>
    
    <!-- Neon Accent Gradients -->
    <linearGradient id="festopiyaFuchsia" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#D946EF" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>

    <linearGradient id="festopiyaOrange" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EC4899" />
      <stop offset="60%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>
    
    <!-- Neon Soft Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base with rounded corners -->
  <rect width="512" height="512" rx="128" fill="url(#bgGlow)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#312E81" stroke-width="4" opacity="0.6" />

  <!-- Center Logo Component: Stylized F + Event Flame + Star -->
  <g transform="translate(128, 80)" filter="url(#neonGlow)">
    <!-- Stylized dynamic 'F' representing Events/Fests -->
    <path d="M 30 30 
             L 210 30 
             C 230 55, 210 85, 175 85 
             L 90 85 
             L 90 145 
             L 165 145 
             C 180 170, 160 200, 130 200 
             L 90 200 
             L 90 260 
             C 90 280, 70 290, 45 290 
             C 25 290, 30 250, 30 220 
             L 30 30 Z" 
          fill="url(#festopiyaFuchsia)" />

    <!-- Overlapping Flame shape representing Food Stall marketplace -->
    <path d="M 130 90 
             C 170 90, 220 135, 195 190 
             C 170 240, 110 260, 135 295 
             C 150 315, 175 310, 190 285 
             C 200 270, 210 245, 225 255 
             C 240 265, 225 310, 185 325 
             C 135 345, 95 315, 95 265 
             C 95 215, 145 180, 135 90 Z" 
          fill="url(#festopiyaOrange)" 
          opacity="0.95" />

    <!-- Sleek Star (Festivals / Celebrations) -->
    <path d="M 210 10 L 214 22 L 226 26 L 214 30 L 210 42 L 206 30 L 194 26 L 206 22 Z" fill="#FFFFFF" />
    <path d="M 60 230 L 62 236 L 68 238 L 62 240 L 60 246 L 58 240 L 52 238 L 58 236 Z" fill="#FFFFFF" opacity="0.8" />
  </g>
</svg>
