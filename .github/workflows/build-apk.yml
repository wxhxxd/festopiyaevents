name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build static Next.js export
        run: |
          npm run android:sync > build-log.txt 2>&1

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build-log
          path: build-log.txt

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug > ../gradle-build-log.txt 2>&1

      - name: Print Gradle build log on failure
        if: failure()
        run: cat gradle-build-log.txt

      - name: Upload Gradle build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build-log.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: festopiya-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
